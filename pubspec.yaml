name: connactions_app
description: "ConnActions: turmas de amigos propondo e vivendo atividades em rodízio."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  material_symbols_icons: ^4.2960.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Epilogue
      fonts:
        - asset: assets/fontes/Epilogue-SemiBold.ttf
          weight: 600
        - asset: assets/fontes/Epilogue-Bold.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fontes/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fontes/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fontes/PlusJakartaSans-Bold.ttf
          weight: 700
