name: connactions_app
description: "ConnActions: turmas de amigos propondo e vivendo atividades em rodízio."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  google_sign_in: ^7.2.0
  http: ^1.6.0
  material_symbols_icons: ^4.2960.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Epilogue
      fonts:
        - asset: assets/fontes/Epilogue-SemiBold.ttf
          weight: 600
        - asset: assets/fontes/Epilogue-Bold.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fontes/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fontes/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fontes/PlusJakartaSans-Bold.ttf
          weight: 700
